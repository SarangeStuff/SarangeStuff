<title>MEC2047 Kinematics Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gentle, step-by-step companion to MEC2047S Dynamics I, Part I: kinematics, with an emphasis on drawing velocity and acceleration vector diagrams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: drafting-table book. Sticky contents rail on wide screens, one reading column,
   figures on graph-paper panels. Vector colours are a fixed code used in every diagram. */
:root {
  --bg: #f4f6f9;
  --paper: #ffffff;
  --ink: #18202b;
  --muted: #586476;
  --rule: #d6dce5;
  --grid: rgba(70, 105, 160, 0.075);
  --c-abs: #1c5cc2;
  --c-n: #b25c00;
  --c-t: #12804a;
  --c-ans: #c0154c;
  --c-cons: #8791a1;
  --link: #cbd3df;
  --tint-abs: #e6eefb;
  --tint-n: #fbefe0;
  --tint-t: #e2f3e9;
  --tint-ans: #fbe6ed;
  --f-display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-mono: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --paper: #171c24; --ink: #e5e9ef; --muted: #9ba6b5; --rule: #2b3340;
    --grid: rgba(140, 170, 220, 0.07);
    --c-abs: #77a9ff; --c-n: #f2a54a; --c-t: #4fcb8c; --c-ans: #ff6b9a; --c-cons: #6f7a8a;
    --link: #3b4656; --tint-abs: #1a2740; --tint-n: #33240f; --tint-t: #12301f; --tint-ans: #3a1724;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --paper: #171c24; --ink: #e5e9ef; --muted: #9ba6b5; --rule: #2b3340;
  --grid: rgba(140, 170, 220, 0.07);
  --c-abs: #77a9ff; --c-n: #f2a54a; --c-t: #4fcb8c; --c-ans: #ff6b9a; --c-cons: #6f7a8a;
  --link: #3b4656; --tint-abs: #1a2740; --tint-n: #33240f; --tint-t: #12301f; --tint-ans: #3a1724;
  color-scheme: dark;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17.5px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.layout {
  display: grid; grid-template-columns: 250px minmax(0, 780px); gap: 56px;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 80px;
}
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 8px; max-width: 800px; margin: 0 auto; } }

/* ---- contents rail */
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; max-height: calc(100vh - 40px); overflow: auto; font-family: var(--f-display); }
.toc summary { font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); cursor: pointer; padding: 6px 0; list-style: none; }
.toc summary::-webkit-details-marker { display: none; }
.toc summary::after { content: " +"; }
.toc details[open] summary::after { content: " −"; }
.toc ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 1px; }
.toc a { display: grid; grid-template-columns: 2.1em 1fr; gap: 4px; padding: 6px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 0.93rem; line-height: 1.3; }
.toc a:hover { background: var(--paper); }
.toc a.is-current { background: var(--paper); box-shadow: inset 2px 0 0 var(--c-abs); }
.toc .toc-num { font-family: var(--f-mono); color: var(--muted); font-size: 0.85em; }
@media (max-width: 1080px) {
  .toc { position: static; max-height: none; border: 1px solid var(--rule); background: var(--paper); padding: 4px 14px; border-radius: 6px; }
}

/* ---- type */
main { min-width: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-weight: 800; font-size: clamp(2.5rem, 7vw, 4.1rem); letter-spacing: -0.02em; }
h2 { font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.01em; }
h3 { font-weight: 800; font-size: 1.32rem; margin-top: 2.4rem; }
h4 { font-weight: 600; font-size: 1.05rem; margin-top: 1.6rem; }
p, li { max-width: var(--measure); }
p { margin: 0.9em 0; }
a { color: var(--c-abs); }
strong { font-weight: 600; }
.eyebrow { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 1.16rem; color: var(--ink); }
.k-abs { color: var(--c-abs); font-weight: 600; } .k-n { color: var(--c-n); font-weight: 600; }
.k-t { color: var(--c-t); font-weight: 600; } .k-ans { color: var(--c-ans); font-weight: 600; } .k-cons { color: var(--muted); font-weight: 600; }
code, .mono { font-family: var(--f-mono); font-size: 0.9em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }

/* ---- hero */
.hero { padding: 18px 0 8px; }
.hero h1 { margin: 10px 0 14px; }
.hero h1 em { font-style: normal; color: var(--c-abs); }
.legend { margin-top: 26px; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 16px 18px; }
.legend h2 { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.legend ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 22px; }
.legend li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; font-size: 0.95rem; line-height: 1.4; }
.legend svg { width: 46px; height: 16px; margin-top: 3px; overflow: visible; }

/* ---- chapters */
.chapter { padding-top: 40px; margin-top: 40px; border-top: 1px solid var(--rule); scroll-margin-top: 12px; }
.chapter.hero { border-top: 0; margin-top: 0; padding-top: 0; }
.chapter > header { margin-bottom: 18px; }
.chapter > header .eyebrow { display: block; margin-bottom: 8px; }
.chapter h3, .chapter h4 { scroll-margin-top: 12px; }
.inthis { font-family: var(--f-display); font-size: 0.95rem; color: var(--muted); border-left: 2px solid var(--rule); padding: 2px 0 2px 14px; margin: 18px 0; }
.inthis ul { margin: 6px 0 0; padding-left: 18px; }

/* ---- callouts */
.callout { margin: 1.5rem 0; padding: 14px 18px; border-radius: 6px; max-width: calc(var(--measure) + 36px); }
.callout > .tag { display: block; font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.callout p:first-of-type { margin-top: 0; } .callout p:last-child { margin-bottom: 0; }
.big { background: var(--tint-abs); } .big > .tag { color: var(--c-abs); }
.why { background: var(--paper); border: 1px dashed var(--rule); } .why > .tag { color: var(--c-t); }
.slip { background: var(--tint-ans); } .slip > .tag { color: var(--c-ans); }
.recap { background: var(--paper); border: 1px solid var(--rule); } .recap > .tag { color: var(--c-n); }
.recap ul { margin: 0; padding-left: 20px; }
.why-inline { display: block; margin-top: 4px; font-size: 0.95em; color: var(--muted); }
.why-inline::before { content: "Why: "; font-family: var(--f-mono); font-size: 0.8em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-t); font-weight: 600; }

/* ---- equations */
.eq { margin: 1rem 0; padding: 10px 14px; overflow-x: auto; overflow-y: hidden; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; max-width: calc(var(--measure) + 30px); }
.eq.key { border-color: var(--ink); box-shadow: 3px 3px 0 var(--rule); }
mjx-container[display="true"] { margin: 0.4em 0 !important; }
mjx-container { color: var(--ink); }

/* ---- worked examples */
.example { margin: 2.2rem 0; border-top: 3px solid var(--ink); padding-top: 12px; }
.example > .ex-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.example > .ex-head h4 { margin: 0; font-size: 1.18rem; font-weight: 800; }
.example > .ex-head .src { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.problem { font-style: italic; }
ol.work { counter-reset: w; list-style: none; padding: 0; margin: 1rem 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
ol.work > li, ol.steplist li, .callout, .example { min-width: 0; }
ol.work[start="2"] { counter-reset: w 1; } ol.work[start="3"] { counter-reset: w 2; } ol.work[start="4"] { counter-reset: w 3; }
ol.work[start="5"] { counter-reset: w 4; } ol.work[start="6"] { counter-reset: w 5; } ol.work[start="7"] { counter-reset: w 6; }
ol.work > li { counter-increment: w; position: relative; padding-left: 40px; }
ol.work > li::before { content: counter(w); position: absolute; left: 0; top: 0.1em; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); font-family: var(--f-mono); font-size: 0.8rem; font-weight: 600; display: grid; place-items: center; }
.answer { font-family: var(--f-display); font-weight: 800; padding: 10px 14px; background: var(--tint-ans); border-radius: 6px; display: inline-block; margin: 6px 0; }

/* ---- tables */
.tablewrap { overflow-x: auto; margin: 1.2rem 0; max-width: 100%; }
table { border-collapse: collapse; font-size: 0.95rem; min-width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--f-display); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
td.ok { color: var(--c-t); font-weight: 600; white-space: nowrap; } td.no { color: var(--c-ans); font-weight: 600; white-space: nowrap; }
td .mono { white-space: nowrap; }

/* ---- figures */
figure { margin: 1.6rem 0; }
.panel {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  border: 1px solid var(--rule); border-radius: 6px; padding: 16px 14px 12px; overflow-x: auto;
}
.panel > figcaption, .figrow + figcaption, figcaption { font-family: var(--f-display); font-size: 0.86rem; color: var(--muted); margin-top: 10px; line-height: 1.4; }
.figrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
.figrow > figure { flex: 1 1 280px; min-width: 0; margin: 0; }
.figrow-wrap { margin: 1.6rem 0; }
svg.fig { display: block; margin: 0 auto; max-width: 100%; height: auto; overflow: visible; font-family: var(--f-body); font-size: 13.5px; }
svg.fig.wide { width: 100%; }
.fig .lbl { fill: var(--ink); }
.fig .lbl.abs { fill: var(--c-abs); } .fig .lbl.n { fill: var(--c-n); } .fig .lbl.t { fill: var(--c-t); }
.fig .lbl.ans { fill: var(--c-ans); } .fig .lbl.muted, .fig .lbl.dimt { fill: var(--muted); } .fig .lbl.dimt { font-size: 12px; }
.fig .vec line { stroke-width: 2.4; stroke-linecap: round; }
.fig .vec.abs line { stroke: var(--c-abs); } .fig .vec.abs polygon { fill: var(--c-abs); }
.fig .vec.n line { stroke: var(--c-n); } .fig .vec.n polygon { fill: var(--c-n); }
.fig .vec.t line { stroke: var(--c-t); } .fig .vec.t polygon { fill: var(--c-t); }
.fig .vec.ans line { stroke: var(--c-ans); } .fig .vec.ans polygon { fill: var(--c-ans); }
.fig .vec.ink line, .fig .vec.muted line { stroke: var(--muted); } .fig .vec.ink polygon, .fig .vec.muted polygon { fill: var(--muted); }
.fig line.cons, .fig path.cons { stroke: var(--c-cons); stroke-width: 1.3; stroke-dasharray: 7 5; fill: none; }
.fig line.ink { stroke: var(--ink); stroke-width: 1.5; } .fig line.muted { stroke: var(--muted); stroke-width: 1.2; }
.fig path.ink { fill: none; stroke: var(--ink); stroke-width: 1.5; } .fig path.muted { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.fig .link { stroke: var(--link); stroke-linecap: round; }
.fig .pin { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.fig .support { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.fig .ground { stroke: var(--ink); stroke-width: 1.5; } .fig .hatch { stroke: var(--muted); stroke-width: 1; }
.fig .guide { stroke: var(--muted); stroke-width: 1.3; }
.fig .block { fill: var(--tint-abs); stroke: var(--ink); stroke-width: 1.4; }
.fig .arc { fill: none; stroke-width: 1.3; }
.fig .arc.muted { stroke: var(--muted); } .fig .arc.ink { stroke: var(--ink); } .fig .arc.abs { stroke: var(--c-abs); } .fig .arc.ans { stroke: var(--c-ans); }
.fig .archead.muted { fill: var(--muted); } .fig .archead.ink { fill: var(--ink); } .fig .archead.abs { fill: var(--c-abs); }
.fig .dim line { stroke: var(--muted); stroke-width: 0.9; } .fig .dim polygon { fill: var(--muted); }
.fig .dotk { fill: var(--ink); } .fig .dotans { fill: var(--c-ans); } .fig .car { fill: var(--ink); }
.fig .outline { fill: none; stroke: var(--ink); stroke-width: 1.5; } .fig .outline.thin { stroke-width: 0.8; stroke: var(--muted); }
.fig .tri { fill: var(--tint-abs); stroke: var(--ink); stroke-width: 1.5; }
.fig .axis { stroke: var(--ink); stroke-width: 1.2; } .fig line.grid { stroke: var(--muted); stroke-width: 0.8; }
.fig .curve { fill: none; stroke: var(--ink); stroke-width: 2; } .fig .area { fill: var(--tint-t); }
.fig .road { stroke: var(--muted); stroke-width: 1.5; } .fig .rope { stroke: var(--ink); stroke-width: 1.6; }
.fig .ramark { fill: none; stroke: var(--muted); stroke-width: 1; }
.fig .scalebar line { stroke: var(--ink); stroke-width: 1.4; }

/* ---- step-through diagrams */
.stepper [data-step] { transition: opacity 0.25s ease; }
.stepper [data-step].is-future { opacity: 0; }
.stepper [data-step].is-now .vec line { stroke-width: 3.6; }
.stepper [data-step].is-now line.cons { stroke-width: 2.2; }
.stepbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-family: var(--f-display); }
.stepbar button { font: 600 0.85rem var(--f-display); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.stepbar button:hover { border-color: var(--ink); }
.stepbar button:focus-visible, ol.steplist li:focus-visible, .toc a:focus-visible { outline: 2px solid var(--c-abs); outline-offset: 2px; }
.stepbar .count { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); margin-left: auto; }
ol.steplist { margin: 12px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 4px; font-family: var(--f-body); font-size: 0.97rem; }
ol.steplist li { counter-increment: s; position: relative; padding: 6px 8px 6px 40px; border-radius: 5px; cursor: pointer; max-width: none; }
ol.steplist li::before { content: counter(s); position: absolute; left: 8px; top: 7px; font-family: var(--f-mono); font-size: 0.78rem; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--rule); }
ol.steplist li:hover { background: var(--bg); }
ol.steplist li.is-now { background: var(--tint-abs); }
ol.steplist li.is-now::before { background: var(--ink); color: var(--paper); border-color: var(--ink); }
ol.steplist li.is-future { opacity: 0.5; }

/* ---- lab */
.lab { border: 1px solid var(--ink); border-radius: 8px; background: var(--paper); padding: 16px; margin: 2rem 0; }
.lab label { font-family: var(--f-display); font-weight: 600; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.lab input[type="range"] { flex: 1 1 220px; accent-color: var(--c-abs); }
.lab .readout { font-family: var(--f-mono); font-size: 0.9rem; }
.lab .labgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.lab .labgrid > div { min-width: 0; }
.lab .labgrid h4 { margin: 0 0 6px; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lab svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 5px; overflow: hidden; }
.lab .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 12px; font-family: var(--f-mono); font-size: 0.86rem; }
.lab .nums b { font-family: var(--f-display); }

footer.colophon { font-family: var(--f-display); font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--rule); margin-top: 60px; padding-top: 18px; }
</style>
